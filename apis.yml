name: Platfora
description: Platfora was a big-data analytics company founded in 2011 by Ben Werther that provided
  in-memory business intelligence and data visualization directly on top of Apache Hadoop, letting
  analysts run interactive queries, build "lenses," and share dashboards without ETL into a separate
  warehouse. Backed by Andreessen Horowitz, Battery Ventures, In-Q-Tel and others, it raised roughly
  $65M before Workday acquired the company in July 2016 and folded the technology into Workday's
  analytics stack. The standalone Platfora product and platfora.com developer surface were subsequently
  discontinued; the domain no longer resolves and no public API or developer program remains.
